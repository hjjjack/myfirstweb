<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jackone的网页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 粒子背景 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* 顶部装饰线 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00d2ff, #7b2ff7, #ff6ec7, transparent);
            background-size: 200% 100%;
            animation: shimmer 4s ease infinite;
            z-index: 100;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 16px 14px;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        /* 标题区域 */
        .header {
            margin-bottom: 18px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: clamp(1.4rem, 4.5vw, 2.8rem);
            font-weight: 800;
            background: linear-gradient(135deg, #00d2ff, #7b2ff7, #ff6ec7);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease infinite;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .header .divider {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            margin: 10px auto;
            border-radius: 2px;
        }

        /* 导航网格 - 桌面端 3列 */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        /* 导航卡片 */
        .nav-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 10px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.06),
                transparent
            );
            transition: left 0.6s ease;
        }

        .nav-card:hover::before,
        .nav-card:active::before {
            left: 100%;
        }

        .nav-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            padding: 2px;
            background: var(--card-gradient, linear-gradient(135deg, #00d2ff, #7b2ff7));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .nav-card:hover::after,
        .nav-card:active::after {
            opacity: 1;
        }

        .nav-card:hover {
            transform: translateY(-5px) scale(1.03);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3),
                        0 0 25px var(--card-glow, rgba(0, 210, 255, 0.15));
        }

        /* 各卡片主题色 */
        .nav-card.homeassistant {
            --card-gradient: linear-gradient(135deg, #00d2ff, #0090d9);
            --card-glow: rgba(0, 210, 255, 0.2);
            animation-delay: 0.1s;
        }

        .nav-card.esphome {
            --card-gradient: linear-gradient(135deg, #2ecc71, #27ae60);
            --card-glow: rgba(46, 204, 113, 0.2);
            animation-delay: 0.2s;
        }

        .nav-card.video {
            --card-gradient: linear-gradient(135deg, #ff6b6b, #ee5a24);
            --card-glow: rgba(255, 107, 107, 0.2);
            animation-delay: 0.3s;
        }

        .nav-card.radio {
            --card-gradient: linear-gradient(135deg, #f7971e, #ffd200);
            --card-glow: rgba(247, 151, 30, 0.2);
            animation-delay: 0.4s;
        }

        .nav-card.book {
            --card-gradient: linear-gradient(135deg, #a855f7, #7c3aed);
            --card-glow: rgba(168, 85, 247, 0.2);
            animation-delay: 0.5s;
        }

        .nav-card.favorites {
            --card-gradient: linear-gradient(135deg, #ec4899, #f43f5e);
            --card-glow: rgba(236, 72, 153, 0.2);
            animation-delay: 0.6s;
        }

        /* 图标 */
        .card-icon {
            font-size: 2rem;
            margin-bottom: 6px;
            transition: transform 0.35s ease;
            filter: drop-shadow(0 0 6px var(--card-glow));
        }

        .nav-card:hover .card-icon {
            transform: scale(1.12) rotate(5deg);
        }

        /* 卡片标题 */
        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }

        /* 卡片描述 */
        .card-desc {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.35;
        }

        /* 箭头指示 */
        .card-arrow {
            margin-top: 6px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }

        .nav-card:hover .card-arrow {
            color: #fff;
            transform: translateX(3px);
        }

        /* 底部 */
        .footer {
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            animation: fadeIn 1.5s ease 1s both;
        }

        /* 动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 点击涟漪 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0);
            animation: rippleAnim 0.5s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ====== 手机端适配：一屏显示全部 ====== */
        @media (max-width: 768px) {
            body {
                justify-content: flex-start;
                padding: 0;
            }

            .container {
                padding: 12px 10px;
                justify-content: center;
            }

            .header {
                margin-bottom: 12px;
            }

            .header h1 {
                font-size: 1.5rem;
                letter-spacing: 1.5px;
            }

            .header .subtitle {
                font-size: 0.6rem;
                letter-spacing: 3px;
            }

            .header .divider {
                width: 40px;
                margin: 8px auto;
            }

            .nav-grid {
                gap: 8px;
            }

            .nav-card {
                padding: 14px 6px;
                border-radius: 12px;
            }

            .card-icon {
                font-size: 1.7rem;
                margin-bottom: 4px;
            }

            .card-title {
                font-size: 0.85rem;
                margin-bottom: 2px;
            }

            .card-desc {
                font-size: 0.6rem;
                line-height: 1.25;
            }

            .card-arrow {
                margin-top: 4px;
                font-size: 0.85rem;
            }

            .footer {
                margin-top: 10px;
                font-size: 0.55rem;
            }
        }

        /* 小屏手机进一步压缩 */
        @media (max-width: 380px) {
            .header h1 {
                font-size: 1.3rem;
            }

            .nav-card {
                padding: 12px 4px;
            }

            .card-icon {
                font-size: 1.5rem;
                margin-bottom: 3px;
            }

            .card-title {
                font-size: 0.78rem;
            }

            .card-desc {
                font-size: 0.55rem;
            }

            .nav-grid {
                gap: 6px;
            }
        }

        /* 横屏手机 */
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                padding: 8px 14px;
            }

            .header {
                margin-bottom: 8px;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .header .divider {
                margin: 5px auto;
            }

            .nav-grid {
                gap: 6px;
            }

            .nav-card {
                padding: 10px 8px;
            }

            .card-icon {
                font-size: 1.4rem;
                margin-bottom: 2px;
            }

            .card-title {
                font-size: 0.8rem;
            }

            .card-desc {
                font-size: 0.55rem;
            }

            .card-arrow {
                margin-top: 2px;
            }

            .footer {
                margin-top: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <!-- 粒子容器 -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>Jackone的网页</h1>
            <div class="divider"></div>
            <p class="subtitle">Personal Navigation Hub</p>
        </div>

        <!-- 导航卡片 -->
        <div class="nav-grid">

            <a href="https://www.home-assistant.io" target="_blank" rel="noopener noreferrer" class="nav-card homeassistant">
                <div class="card-icon">🏠</div>
                <div class="card-title">Home Assistant</div>
                <div class="card-desc">开源智能家居平台<br>掌控全屋自动化</div>
                <div class="card-arrow">→</div>
            </a>

            <a href="https://esphome.io" target="_blank" rel="noopener noreferrer" class="nav-card esphome">
                <div class="card-icon">🔧</div>
                <div class="card-title">ESPHome</div>
                <div class="card-desc">ESP设备固件方案<br>轻松定制物联网节点</div>
                <div class="card-arrow">→</div>
            </a>

            <a href="#" target="_blank" rel="noopener noreferrer" class="nav-card video">
                <div class="card-icon">🎬</div>
                <div class="card-title">Video</div>
                <div class="card-desc">视频资源中心<br>精彩内容随时看</div>
                <div class="card-arrow">→</div>
            </a>

            <a href="https://radio.dubbeh.net/stations/st-4e9a60c7-514448?listen=1" target="_blank" rel="noopener noreferrer" class="nav-card radio">
                <div class="card-icon">📻</div>
                <div class="card-title">Radio</div>
                <div class="card-desc">网络电台收听<br>音乐与声音的世界</div>
                <div class="card-arrow">→</div>
            </a>

            <a href="#" target="_blank" rel="noopener noreferrer" class="nav-card book">
                <div class="card-icon">📚</div>
                <div class="card-title">Book</div>
                <div class="card-desc">阅读与书摘笔记<br>知识积累每一天</div>
                <div class="card-arrow">→</div>
            </a>

            <a href="#" target="_blank" rel="noopener noreferrer" class="nav-card favorites">
                <div class="card-icon">⭐</div>
                <div class="card-title">Favorites</div>
                <div class="card-desc">精选收藏夹<br>值得回味的宝藏</div>
                <div class="card-arrow">→</div>
            </a>

        </div>

        <!-- 底部 -->
        <div class="footer">
            © 2026 Jackone · Crafted with ❤️
        </div>
    </div>

    <script>
        // 生成粒子背景（手机端减少数量以提升性能）
        function createParticles() {
            const container = document.getElementById('particles');
            const isMobile = window.innerWidth <= 768;
            const particleCount = isMobile ? 25 : 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');

                const size = Math.random() * 3 + 1;
                const left = Math.random() * 100;
                const duration = Math.random() * 15 + 10;
                const delay = Math.random() * 10;

                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = left + '%';
                particle.style.animationDuration = duration + 's';
                particle.style.animationDelay = delay + 's';

                const colors = [
                    'rgba(0, 210, 255, 0.25)',
                    'rgba(123, 47, 247, 0.25)',
                    'rgba(255, 110, 199, 0.25)',
                    'rgba(255, 255, 255, 0.12)'
                ];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];

                container.appendChild(particle);
            }
        }

        // 点击涟漪效果
        document.querySelectorAll('.nav-card').forEach(card => {
            card.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');

                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
                ripple.style.top = e.clientY - rect.top - size / 2 + 'px';

                this.appendChild(ripple);

                setTimeout(() => ripple.remove(), 500);
            });
        });

        // 初始化
        createParticles();
    </script>

</body>
</html>
